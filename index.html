<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Interference Sandbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #11141a;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.4rem; margin: 5px 0; color: #fff; text-align: center; }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }
        .panel {
            background: #1b1f29;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2d3345;
        }
        .mode-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            background: #2a3142;
            border: 1px solid #3f4a63;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #3b82f6;
        }
        .slider-box {
            margin-bottom: 12px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #94a3b8;
        }
        .slider-label span.num { color: #3b82f6; font-weight: bold; }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #2d3345;
            border-radius: 3px;
            outline: none;
        }
        canvas {
            background: #000;
            border-radius: 6px;
            width: 100%;
            display: block;
            margin-top: 5px;
            border: 1px solid #2d3345;
        }
        .title-tag {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .fringe-readouts {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #a0aec0;
            line-height: 1.4;
            background: #11141a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2d3345;
        }
    </style>
</head>
<body>

<h1>Wave Interference & Diffraction Lab</h1>

<div class="container">
    <div class="panel">
        <div class="mode-row">
            <button class="btn active" id="m-double">Double Slit Mode</button>
            <button class="btn" id="m-single">Single Slit Mode</button>
        </div>

        <div class="slider-box">
            <div class="slider-label"><span>Wavelength (λ)</span><span class="num" id="txt-wave">550 nm</span></div>
            <input type="range" id="input-wave" min="400" max="700" value="550">
        </div>

        <div class="slider-box">
            <div class="slider-label"><span>Slit Width (a)</span><span class="num" id="txt-width">4.0 μm</span></div>
            <input type="range" id="input-width" min="10" max="80" value="40">
        </div>

        <div class="slider-box" id="box-sep">
            <div class="slider-label"><span>Slit Separation (d)</span><span class="num" id="txt-sep">20.0 μm</span></div>
            <input type="range" id="input-sep" min="100" max="300" value="200">
        </div>

        <div class="slider-box">
            <div class="slider-label"><span>Distance to Screen (D)</span><span class="num" id="txt-dist">1.20 m</span></div>
            <input type="range" id="input-dist" min="5" max="20" value="12">
        </div>
        
        <div class="fringe-readouts" id="fringe-info">
            Calculating position dynamics...
        </div>
    </div>

    <div class="panel">
        <div class="title-tag">Wave Propagation Animation</div>
        <canvas id="waveCanvas" height="120"></canvas>
    </div>

    <div class="panel">
        <div class="title-tag">Intensity Profile Graph (with Max/Min Positions)</div>
        <canvas id="graphCanvas" height="140"></canvas>
    </div>

    <div class="panel">
        <div class="title-tag">Laser Screen Projection View</div>
        <canvas id="screenCanvas" height="60"></canvas>
    </div>
</div>

<script>
    let currentMode = 'double';

    const sliders = {
        wave: document.getElementById('input-wave'),
        width: document.getElementById('input-width'),
        sep: document.getElementById('input-sep'),
        dist: document.getElementById('input-dist')
    };

    const texts = {
        wave: document.getElementById('txt-wave'),
        width: document.getElementById('txt-width'),
        sep: document.getElementById('txt-sep'),
        dist: document.getElementById('txt-dist'),
        info: document.getElementById('fringe-info')
    };

    const cWave = document.getElementById('waveCanvas');
    const cGraph = document.getElementById('graphCanvas');
    const cScreen = document.getElementById('screenCanvas');
    
    const ctxWave = cWave.getContext('2d');
    const ctxGraph = cGraph.getContext('2d');
    const ctxScreen = cScreen.getContext('2d');

    function getWaveColorHex(wl) {
        if (wl >= 400 && wl < 440) return "#7e00ff";
        if (wl >= 440 && wl < 490) return "#004cff";
        if (wl >= 490 && wl < 510) return "#00ffb2";
        if (wl >= 510 && wl < 580) return "#00ff00";
        if (wl >= 580 && wl < 645) return "#ffbb00";
        if (wl >= 645 && wl <= 700) return "#ff0000";
        return "#ffffff";
    }

    function renderLoop() {
        const waveValue = parseInt(sliders.wave.value);
        const widthValue = parseInt(sliders.width.value);
        const sepValue = parseInt(sliders.sep.value);
        const distValue = parseInt(sliders.dist.value);

        texts.wave.innerText = waveValue + " nm";
        texts.width.innerText = (widthValue / 10).toFixed(1) + " μm";
        texts.sep.innerText = (sepValue / 10).toFixed(1) + " μm";
        texts.dist.innerText = (distValue / 10).toFixed(2) + " m";

        const lambda = waveValue * 1e-9;
        const slitA = widthValue * 1e-7;
        const slitD = sepValue * 1e-7;
        const screenD = distValue * 0.1;

        const wW = cWave.width, hW = cWave.height;
        const wG = cGraph.width, hG = cGraph.height;
        const wS = cScreen.width, hS = cScreen.height;

        ctxWave.clearRect(0, 0, wW, hW);
        ctxGraph.clearRect(0, 0, wG, hG);
        ctxScreen.clearRect(0, 0, wS, hS);

        const colorHex = getWaveColorHex(waveValue);

        // 1. ANIMATED WAVE PROPAGATION VIEW
        ctxWave.fillStyle = '#1e222b';
        ctxWave.fillRect(80, 0, 4, hW); // Slit barrier wall

        ctxWave.strokeStyle = colorHex;
        ctxWave.lineWidth = 1.5;
        let animatedPhase = (Date.now() / 150) % 20;

        if (currentMode === 'double') {
            let slit1Y = hW / 2 - 20, slit2Y = hW / 2 + 20;
            for(let radius = animatedPhase; radius < wW - 80; radius += 15) {
                ctxWave.globalAlpha = Math.max(0, 1 - radius / (wW - 80));
                ctxWave.beginPath(); ctxWave.arc(84, slit1Y, radius, -Math.PI/2, Math.PI/2); ctxWave.stroke();
                ctxWave.beginPath(); ctxWave.arc(84, slit2Y, radius, -Math.PI/2, Math.PI/2); ctxWave.stroke();
            }
            ctxWave.globalAlpha = 1.0;
            ctxWave.fillStyle = '#000';
            ctxWave.fillRect(80, slit1Y - 2, 4, 4); ctxWave.fillRect(80, slit2Y - 2, 4, 4);
        } else {
            let centerSlitY = hW / 2;
            for(let radius = animatedPhase; radius < wW - 80; radius += 15) {
                ctxWave.globalAlpha = Math.max(0, 1 - radius / (wW - 80));
                ctxWave.beginPath(); ctxWave.arc(84, centerSlitY, radius, -Math.PI/2, Math.PI/2); ctxWave.stroke();
            }
            ctxWave.globalAlpha = 1.0;
            ctxWave.fillStyle = '#000';
            ctxWave.fillRect(80, centerSlitY - 6, 4, 12);
        }

        // 2. GRAPH & LASER SCREEN GEOMETRY PATTERN LOOP
        ctxGraph.strokeStyle = '#334155';
        ctxGraph.lineWidth = 1;
        ctxGraph.beginPath();
        ctxGraph.moveTo(0, hG - 20); ctxGraph.lineTo(wG, hG - 20); // Baseline x-axis
        ctxGraph.moveTo(wG / 2, 0); ctxGraph.lineTo(wG / 2, hG);   // Central axis
        ctxGraph.stroke();

        ctxGraph.strokeStyle = colorHex;
        ctxGraph.lineWidth = 2.5;
        ctxGraph.beginPath();

        const sweepAngle = 0.08;

        for (let i = 0; i < wG; i++) {
            let ratio = (i - wG / 2) / (wG / 2);
            let theta = ratio * sweepAngle;

            let beta = (Math.PI * slitA * Math.sin(theta)) / lambda;
            let diffFactor = (beta === 0) ? 1.0 : Math.pow(Math.sin(beta) / beta, 2);

            let totalIntensity = diffFactor;
            if (currentMode === 'double') {
                let alpha = (Math.PI * slitD * Math.sin(theta)) / lambda;
                totalIntensity = diffFactor * Math.pow(Math.cos(alpha), 2);
            }

            let graphY = (hG - 20) - (totalIntensity * (hG - 35));
            if (i === 0) ctxGraph.moveTo(i, graphY); else ctxGraph.lineTo(i, graphY);

            ctxScreen.globalAlpha = Math.max(0, Math.min(1, totalIntensity));
            ctxScreen.fillStyle = colorHex;
            ctxScreen.fillRect(i, 0, 1, hS);
        }
        ctxGraph.globalAlpha = 1.0;
        ctxGraph.stroke();

        // 3. ADD PHYSICAL POSITION LABELS FOR MAXIMA AND MINIMA
        ctxGraph.fillStyle = '#94a3b8';
        ctxGraph.font = '10px Arial';
        
        // Central Bright Peak
        ctxGraph.fillStyle = '#fff';
        ctxGraph.fillText("Max (m=0)", wG / 2 - 22, hG - 5);
