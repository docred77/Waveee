<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Interference Sandbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #11141a;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.4rem; margin: 5px 0; color: #fff; text-align: center; }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }
        .panel {
            background: #1b1f29;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2d3345;
        }
        .mode-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            background: #2a3142;
            border: 1px solid #3f4a63;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #3b82f6;
        }
        .slider-box {
            margin-bottom: 12px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #94a3b8;
        }
        .slider-label span.num { color: #3b82f6; font-weight: bold; }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #2d3345;
            border-radius: 3px;
            outline: none;
        }
        canvas {
            background: #000;
            border-radius: 6px;
            width: 100%;
            display: block;
            margin-top: 5px;
            border: 1px solid #2d3345;
        }
        .title-tag {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

<h1>Wave Interference Lab</h1>

<div class="container">
    <div class="panel">
        <div class="mode-row">
            <button class="btn active" id="m-double">Double Slit Mode</button>
            <button class="btn" id="m-single">Single Slit Mode</button>
        </div>

        <div class="slider-box">
            <div class="slider-label"><span>Wavelength (λ)</span><span class="num" id="txt-wave">550 nm</span></div>
            <input type="range" id="input-wave" min="400" max="700" value="550">
        </div>

        <div class="slider-box">
            <div class="slider-label"><span>Slit Width (a)</span><span class="num" id="txt-width">4.0 μm</span></div>
            <input type="range" id="input-width" min="10" max="80" value="40">
        </div>

        <div class="slider-box" id="box-sep">
            <div class="slider-label"><span>Slit Separation (d)</span><span class="num" id="txt-sep">20.0 μm</span></div>
            <input type="range" id="input-sep" min="100" max="300" value="200">
        </div>

        <div class="slider-box">
            <div class="slider-label"><span>Distance to Screen (D)</span><span class="num" id="txt-dist">1.20 m</span></div>
            <input type="range" id="input-dist" min="5" max="20" value="12">
        </div>
    </div>

    <div class="panel">
        <div class="title-tag">Wavefront Diffraction Graph</div>
        <canvas id="graphCanvas" height="130"></canvas>
    </div>

    <div class="panel">
        <div class="title-tag">Laser Screen View</div>
        <canvas id="screenCanvas" height="70"></canvas>
    </div>
</div>

<script>
    let currentMode = 'double';

    const sliders = {
        wave: document.getElementById('input-wave'),
        width: document.getElementById('input-width'),
        sep: document.getElementById('input-sep'),
        dist: document.getElementById('input-dist')
    };

    const texts = {
        wave: document.getElementById('txt-wave'),
        width: document.getElementById('txt-width'),
        sep: document.getElementById('txt-sep'),
        dist: document.getElementById('txt-dist')
    };

    const cGraph = document.getElementById('graphCanvas');
    const cScreen = document.getElementById('screenCanvas');
    const ctxGraph = cGraph.getContext('2d');
    const ctxScreen = cScreen.getContext('2d');

    // Simple hexadecimal hex converter to completely avoid text configuration mismatches
    function getWaveColorHex(wl) {
        if (wl >= 400 && wl < 440) return "#7e00ff";
        if (wl >= 440 && wl < 490) return "#004cff";
        if (wl >= 490 && wl < 510) return "#00ffb2";
        if (wl >= 510 && wl < 580) return "#00ff00";
        if (wl >= 580 && wl < 645) return "#ffbb00";
        if (wl >= 645 && wl <= 700) return "#ff0000";
        return "#ffffff";
    }

    function renderLoop() {
        const waveValue = parseInt(sliders.wave.value);
        const widthValue = parseInt(sliders.width.value);
        const sepValue = parseInt(sliders.sep.value);
        const distValue = parseInt(sliders.dist.value);

        texts.wave.innerText = waveValue + " nm";
        texts.width.innerText = (widthValue / 10).toFixed(1) + " μm";
        texts.sep.innerText = (sepValue / 10).toFixed(1) + " μm";
        texts.dist.innerText = (distValue / 10).toFixed(2) + " m";

        const lambda = waveValue * 1e-9;
        const slitA = widthValue * 1e-7;
        const slitD = sepValue * 1e-7;

        const wG = cGraph.width;
        const hG = cGraph.height;
        const wS = cScreen.width;
        const hS = cScreen.height;

        ctxGraph.clearRect(0, 0, wG, hG);
        ctxScreen.clearRect(0, 0, wS, hS);

        // Baseline reference lines
        ctxGraph.strokeStyle = '#334155';
        ctxGraph.lineWidth = 1;
        ctxGraph.beginPath();
        ctxGraph.moveTo(0, hG - 15); ctxGraph.lineTo(wG, hG - 15);
        ctxGraph.moveTo(wG / 2, 0); ctxGraph.lineTo(wG / 2, hG);
        ctxGraph.stroke();

        const colorHex = getWaveColorHex(waveValue);
        ctxGraph.strokeStyle = colorHex;
        ctxGraph.lineWidth = 2.5;
        ctxGraph.beginPath();

        const sweepAngle = 0.07;

        for (let i = 0; i < wG; i++) {
            let ratio = (i - wG / 2) / (wG / 2);
            let theta = ratio * sweepAngle;

            // Beta tracking variable
            let beta = (Math.PI * slitA * Math.sin(theta)) / lambda;
            let diffFactor = (beta === 0) ? 1.0 : Math.pow(Math.sin(beta) / beta, 2);

            let totalIntensity = diffFactor;
            if (currentMode === 'double') {
                let alpha = (Math.PI * slitD * Math.sin(theta)) / lambda;
                totalIntensity = diffFactor * Math.pow(Math.cos(alpha), 2);
            }

            // Map graph geometry points safely
            let graphY = (hG - 15) - (totalIntensity * (hG - 25));
            if (i === 0) ctxGraph.moveTo(i, graphY); else ctxGraph.lineTo(i, graphY);

            // Directly control projection sensor colors natively without global composite math expressions
            ctxScreen.globalAlpha = Math.max(0, Math.min(1, totalIntensity));
            ctxScreen.fillStyle = colorHex;
            ctxScreen.fillRect(i, 0, 1, hS);
        }
        ctxGraph.globalAlpha = 1.0;
        ctxGraph.stroke();
    }

    // Assign simplified listeners
    Object.keys(sliders).forEach(key => {
        sliders[key].addEventListener('input', renderLoop);
    });

    document.getElementById('m-double').addEventListener('click', function() {
        currentMode = 'double';
        this.classList.add('active');
        document.getElementById('m-single').classList.remove('active');
        document.getElementById('box-sep').style.display = 'block';
        renderLoop();
    });

    document.getElementById('m-single').addEventListener('click', function() {
        currentMode = 'single';
        this.classList.add('active');
        document.getElementById('m-double').classList.remove('active');
        document.getElementById('box-sep').style.display = 'none';
        renderLoop();
    });

    // Run setup immediately
    renderLoop();
</script>

</body>
</html>
